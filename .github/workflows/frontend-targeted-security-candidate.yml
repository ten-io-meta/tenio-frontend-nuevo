name: Evaluate targeted ethers / ws security update (no push)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update only ethers and affected ws transitive family in runner workspace
        run: |
          npm install ethers@6.17.0 --save --save-exact --package-lock-only --ignore-scripts --no-audit
          npm update ws --package-lock-only --ignore-scripts --no-audit
      - name: Install resulting lockfile and test baseline behavior
        run: |
          npm ci
          node --test tests/legacyAdapters.test.mjs
          npm run build
          npm run lint
      - name: Re-audit production and whole lockfile for comparison
        run: node scripts/audit-frontend-dependencies.cjs
      - name: Display package changes and production findings
        run: |
          git diff --stat
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('audit-results/frontend-dependency-audit.json')); console.log('CANDIDATE_SECURITY_COUNTS',JSON.stringify({all:p.summaryAll,production:p.summaryProduction})); if(p.summaryProduction.total>0) process.exitCode=2"
      - name: Archive candidate package and lockfile (never push)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-ethers-ws-locked-candidate
          path: |
            package.json
            package-lock.json
            audit-results/frontend-dependency-audit.json
          if-no-files-found: warn
